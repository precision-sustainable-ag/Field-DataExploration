workdir: ${hydra:runtime.cwd}  # where the code is executed
# data
datadir: ${paths.workdir}/data
processed_datadir: ${paths.datadir}/processed_tables/${job.job_now_date}
# The DB (and its permanent merged-table CSV) live on NFS, not the repo
# working directory, so the weekly cron job and manual runs see the same
# up-to-date data instead of each having their own local copy.
persistent_datadir: /mnt/research-projects/r/raatwell/longterm_images3/field-db
permanent_merged_table: ${paths.persistent_datadir}/merged_blobs_tables_metadata_permanent.csv
db_path: ${paths.persistent_datadir}/field_exploration.db
longterm_storage: /mnt/research-projects/r/raatwell/longterm_images3/field-batches

# Where create_batches_db writes newly-batched raws. Defaults to a local
# in-repo directory for testing - do NOT point this at longterm_storage (the
# real NFS mount) without explicit sign-off.
batches_root: /mnt/research-projects/r/raatwell/longterm_images3/field-batches

# temp
temp_image_dir: ${paths.workdir}/tempdata/temp_images

# report - lives on NFS (siblings of field-db/, not nested under
# longterm_storage/field-batches) so weekly report artifacts are reachable
# by the Globus-shared collection used to deliver them to reviewers.
reportdir: /mnt/research-projects/r/raatwell/longterm_images3/field-reports
reportdir_timestamp: ${paths.reportdir}/${job.job_now_date}
report_plots: ${paths.reportdir_timestamp}/plots
plots_all_years: ${paths.reportdir_timestamp}/plots/plots_all_years
plots_current_season: ${paths.reportdir_timestamp}/plots/plots_current_season
inspectdir: ${paths.reportdir_timestamp}/inspection
missing_batch_folders: ${paths.reportdir_timestamp}/missing_raws.csv
preprocessing_analysis: ${paths.reportdir_timestamp}/preprocessing_analysis.csv
